[package]
name = "anubis"
version = "0.1.0"
description = "A quiet space for Markdown writing"
authors = ["stubbornspace"]
repository = "https://github.com/stubbornspace/Kronos"
edition = "2024"
rust-version = "1.90"

[lib]
name = "anubis_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
tempfile = "3"
notify = "8"

[target.'cfg(not(target_os = "ios"))'.dependencies]
trash = "5"

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
rustix = { version = "1", features = ["fs"] }

[target.'cfg(target_os = "ios")'.dependencies]
tauri-plugin-ios-workspace = { path = "plugins/ios-workspace" }
